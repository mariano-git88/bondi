name: Cron diario de re-indexation

# Dispara un redeploy del servicio en Render cada día a las 06:00 UTC
# (03:00 hora Argentina). Render al redeploy ejecuta el buildCommand del
# render.yaml, que incluye la ingestion del catálogo Shopify y la
# regeneración del FAISS index. Así el catálogo del bot queda al día
# con cualquier producto nuevo, precio o stock que cambie en Shopify.
#
# Setup requerido (una vez):
# 1. En Render → tu servicio → Settings → Deploy Hook URL.
#    Copiar la URL completa (algo tipo https://api.render.com/deploy/srv-xxx?key=yyy).
# 2. En GitHub → repo bondi → Settings → Secrets and variables → Actions
#    → New repository secret. Nombre: RENDER_DEPLOY_HOOK_URL. Valor: la URL.
# 3. Commit este workflow + push. Empieza a correr al día siguiente a las 06:00 UTC.
#
# También se puede disparar manualmente desde la pestaña Actions → "Cron
# diario de re-indexation" → Run workflow.

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC todos los días
  workflow_dispatch:        # botón manual desde GitHub Actions UI

jobs:
  trigger-redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "ERROR: secret RENDER_DEPLOY_HOOK_URL no configurado."
            exit 1
          fi
          curl -X POST -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo ""
          echo "Deploy hook disparado. Mirá el dashboard de Render para ver el progreso."
