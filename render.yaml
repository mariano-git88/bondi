# Render blueprint — dos servicios:
#
#   1. bondi-api     → FastAPI + chat público.        custom domain: bondi.suprabond.ai
#   2. bondi-kitchen → Streamlit (cliente HTTP).      custom domain: admin.suprabond.ai
#
# El backend tiene un disk persistente de 1GB en /data — ahí viven el
# FAISS, la SQLite, los PDFs subidos, y el curation.json. Kitchen NO
# tiene disk: todas las operaciones de lectura/escritura van por HTTP
# a bondi-api (endpoints /admin/*).
#
# Setup en Render (después de pushear el repo):
#
#   1. Dashboard → New → Blueprint → conectar repo `mariano-git88/bondi`.
#   2. Render lee este YAML y crea los 2 services.
#   3. Cargar las env vars en cada uno (marcadas `sync: false`):
#        bondi-api:        ANTHROPIC_API_KEY, OPENAI_API_KEY, BONDI_ADMIN_PASS
#        bondi-kitchen:    BONDI_ADMIN_PASS (la misma)
#      BONDI_BACKEND_URL de kitchen se llena automático con `fromService`.
#   4. Apply → primer build ~3 min (api) + 2 min (kitchen).
#   5. Configurar custom domains:
#        bondi-api    → bondi.suprabond.ai
#        bondi-kitchen → admin.suprabond.ai
#      Render pide agregar un CNAME en GoDaddy apuntando al hostname
#      que Render provee (típicamente <service>.onrender.com).

services:
  # =====================================================================
  # 1. Backend FastAPI + chat público
  # =====================================================================
  - type: web
    name: bondi-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: |
      pip install -r requirements.txt && \
      python ingestion/ingest_shopify.py && \
      python -m ingestion.ingest_web --depth 2 --max-pages 200 && \
      python -m embeddings.build_index
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    disk:
      name: bondi-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BONDI_ADMIN_PASS
        sync: false

  # =====================================================================
  # 2. Backoffice Streamlit (kitchen) — cliente HTTP del backend
  # =====================================================================
  - type: web
    name: bondi-kitchen
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: |
      streamlit run backoffice/app.py \
        --server.port=$PORT \
        --server.address=0.0.0.0 \
        --server.headless=true \
        --browser.gatherUsageStats=false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: BONDI_ADMIN_PASS
        sync: false
      # URL del backend al que pega kitchen. Render la inyecta sola
      # desde el otro service para que apunten bien aunque cambien
      # los hostnames.
      - key: BONDI_BACKEND_URL
        fromService:
          type: web
          name: bondi-api
          property: hostport
